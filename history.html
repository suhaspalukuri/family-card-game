<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game History — Rummy Royale</title>
  <meta name="description" content="View your Rummy Royale game history and statistics." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🃏</text></svg>" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/lobby.css" />
  <script src="https://cdn.ably.com/lib/ably.min-2.js"></script>
  <style>
    .history-page {
      min-height: 100dvh;
      padding: var(--space-6);
    }
    .history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-8);
      flex-wrap: wrap;
      gap: var(--space-4);
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: var(--space-4);
      margin-bottom: var(--space-8);
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
    }
    .stat-card {
      padding: var(--space-5);
      text-align: center;
    }
    .stat-number {
      font-size: var(--text-4xl);
      font-weight: 800;
      color: var(--color-gold);
      line-height: 1;
      margin-bottom: var(--space-2);
    }
    .stat-label {
      font-size: var(--text-sm);
      color: var(--color-text-secondary);
    }
    .history-container {
      max-width: 800px;
      margin: 0 auto;
    }
    .history-section-title {
      font-size: var(--text-xl);
      font-weight: 700;
      margin-bottom: var(--space-4);
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }
    .empty-state {
      text-align: center;
      padding: var(--space-12);
      color: var(--color-text-muted);
    }
    .empty-state-icon {
      font-size: 4rem;
      margin-bottom: var(--space-4);
      opacity: 0.5;
    }
    .empty-state-title {
      font-size: var(--text-xl);
      font-weight: 600;
      margin-bottom: var(--space-2);
      color: var(--color-text-secondary);
    }
    .history-card {
      padding: var(--space-4) var(--space-5);
      margin-bottom: var(--space-3);
      border-radius: var(--radius-xl);
      display: flex;
      align-items: center;
      gap: var(--space-4);
      border: 1px solid var(--color-glass-border);
      background: var(--color-glass);
      transition: background var(--transition-fast);
    }
    .history-card:hover { background: rgba(255,255,255,0.07); }
    .history-card.win {
      border-left: 3px solid var(--color-success);
    }
    .history-card.loss {
      border-left: 3px solid var(--color-text-muted);
    }
    .history-result-badge {
      padding: 0.25rem 0.75rem;
      border-radius: var(--radius-full);
      font-size: var(--text-xs);
      font-weight: 800;
      letter-spacing: 0.05em;
      flex-shrink: 0;
    }
    .history-result-badge.win {
      background: rgba(76, 175, 119, 0.15);
      color: #6DD99A;
      border: 1px solid rgba(76, 175, 119, 0.3);
    }
    .history-result-badge.loss {
      background: rgba(138, 155, 176, 0.1);
      color: var(--color-text-muted);
      border: 1px solid rgba(138, 155, 176, 0.2);
    }
    .history-info { flex: 1; min-width: 0; }
    .history-session {
      font-size: var(--text-xs);
      color: var(--color-text-muted);
      font-family: monospace;
    }
    .history-players {
      font-size: var(--text-sm);
      color: var(--color-text-secondary);
      margin-top: 2px;
    }
    .history-date {
      font-size: var(--text-xs);
      color: var(--color-text-muted);
      text-align: right;
      flex-shrink: 0;
    }
    .duration {
      font-size: var(--text-xs);
      color: var(--color-text-muted);
    }
    .clear-btn { color: var(--color-error); }
  </style>
</head>
<body class="bg-pattern">
<div id="toast-container" class="toast-container" aria-live="polite"></div>

<div class="history-page">
  <header class="history-header">
    <div style="display:flex;align-items:center;gap:1rem">
      <span style="font-size:1.5rem">🃏</span>
      <div>
        <h1 class="text-gold-shimmer" style="font-size:var(--text-2xl);font-weight:800">Rummy Royale</h1>
        <p style="color:var(--color-text-secondary);font-size:var(--text-sm)">Game History</p>
      </div>
    </div>
    <div style="display:flex;gap:0.75rem;align-items:center;flex-wrap:wrap">
      <button class="btn btn-ghost btn-sm clear-btn" id="clear-history-btn">🗑️ Clear History</button>
      <a href="index.html" class="btn btn-ghost btn-sm">🏠 Home</a>
      <a href="lobby.html?new=true" class="btn btn-primary btn-sm">🎲 New Game</a>
    </div>
  </header>

  <!-- Stats -->
  <div class="stats-grid" id="stats-grid">
    <div class="glass stat-card">
      <div class="stat-number" id="stat-total">0</div>
      <div class="stat-label">Games Played</div>
    </div>
    <div class="glass stat-card">
      <div class="stat-number" id="stat-wins">0</div>
      <div class="stat-label">Wins</div>
    </div>
    <div class="glass stat-card">
      <div class="stat-number" id="stat-winrate">0%</div>
      <div class="stat-label">Win Rate</div>
    </div>
    <div class="glass stat-card">
      <div class="stat-number" id="stat-avg-duration">–</div>
      <div class="stat-label">Avg. Duration</div>
    </div>
  </div>

  <!-- History List -->
  <div class="history-container">
    <div class="history-section-title">📋 Recent Games</div>
    <div id="history-list"></div>
  </div>
</div>

<script type="module">
  import { getLocalHistory, getCurrentPlayer } from './js/session.js?v=8';
  import { formatDate, escHtml, showToast } from './js/ui.js';

  const currentPlayer = getCurrentPlayer();
  const history = getLocalHistory();

  function formatDuration(ms) {
    if (!ms || ms < 0) return '–';
    const mins = Math.floor(ms / 60000);
    const secs = Math.floor((ms % 60000) / 1000);
    return `${mins}m ${secs}s`;
  }

  function renderHistory() {
    const listEl = document.getElementById('history-list');
    listEl.innerHTML = '';

    if (history.length === 0) {
      listEl.innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon">🃏</div>
          <div class="empty-state-title">No games yet</div>
          <p>Play your first game to see history here!</p>
          <a href="index.html" class="btn btn-primary btn-lg" style="margin-top:1.5rem">Join a Game →</a>
        </div>
      `;
      return;
    }

    history.forEach(record => {
      const myId      = currentPlayer?.playerId;
      const isWin     = record.winner?.id === myId;
      const winnerName = record.winner?.name || 'Unknown';
      const playerNames = (record.players || []).map(p => escHtml(p.name || p.id || 'Player')).join(', ');

      const card = document.createElement('div');
      card.className = `history-card ${isWin ? 'win' : 'loss'}`;
      card.innerHTML = `
        <div class="history-result-badge ${isWin ? 'win' : 'loss'}">
          ${isWin ? '🏆 WIN' : '😔 LOSS'}
        </div>
        <div class="history-info">
          <div class="history-session">Session: ${escHtml(record.sessionId || '–')}</div>
          <div class="history-players">
            ${isWin ? '🥇 You won!' : `🏆 ${escHtml(winnerName)} won`}
            ${playerNames ? ` · Players: ${playerNames}` : ''}
          </div>
        </div>
        <div class="history-date">
          <div>${escHtml(formatDate(record.date) || '–')}</div>
          <div class="duration">${record.duration ? formatDuration(record.duration) : ''}</div>
        </div>
      `;
      listEl.appendChild(card);
    });
  }

  function renderStats() {
    const myId    = currentPlayer?.playerId;
    const total   = history.length;
    const wins    = history.filter(r => r.winner?.id === myId).length;
    const rate    = total > 0 ? Math.round((wins / total) * 100) : 0;
    const durations = history.filter(r => r.duration > 0).map(r => r.duration);
    const avgDur  = durations.length > 0
      ? durations.reduce((a, b) => a + b, 0) / durations.length
      : null;

    document.getElementById('stat-total').textContent    = total;
    document.getElementById('stat-wins').textContent     = wins;
    document.getElementById('stat-winrate').textContent  = `${rate}%`;
    document.getElementById('stat-avg-duration').textContent = avgDur ? formatDuration(avgDur) : '–';

    // Color win rate
    const winrateEl = document.getElementById('stat-winrate');
    winrateEl.style.color = rate >= 50 ? 'var(--color-success)' : 'var(--color-gold)';
  }

  document.getElementById('clear-history-btn').addEventListener('click', () => {
    if (history.length === 0) { showToast('No history to clear', 'info'); return; }
    if (confirm('Clear all game history? This cannot be undone.')) {
      try {
        localStorage.removeItem('rummy_history');
      } catch (e) {
        console.warn('LocalStorage not available to clear history:', e);
      }
      showToast('History cleared', 'success');
      setTimeout(() => window.location.reload(), 800);
    }
  });

  renderStats();
  renderHistory();
</script>
</body>
</html>
